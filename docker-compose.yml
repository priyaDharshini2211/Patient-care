services:
  postgres:
    image: postgres:16-alpine
    container_name: patient-mgmt-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patient_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Optional: creates the schema on first start (the API can also auto-create it with DB_SYNC=true)
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  pgdata:
